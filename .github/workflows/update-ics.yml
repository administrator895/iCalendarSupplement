name: Update iCalendar files

on:
  workflow_dispatch:
  schedule:
    # Runs at 08:00 Asia/Shanghai every Monday.
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update calendar files
        run: python update_ics.py

      - name: Commit and push changes
        run: |
          git config user.name "jayden"
          git config user.email "67210798+administrator895@users.noreply.github.com"
          git add source_ics custom_ics
          git diff --cached --quiet || git commit -m "Auto-update calendar files"
          git push
